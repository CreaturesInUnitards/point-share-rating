name: weekly-ratings
on:
  schedule:
    - cron: "0 14 * * 2"        # Tuesdays 14:00 UTC, after Monday night results land
  workflow_dispatch:             # manual runs from the Actions tab
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: post-graphics
          path: post/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
